name: Update visual snapshots

on:
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: update-visual-snapshots
    cancel-in-progress: false

jobs:
    update:
        runs-on: ubuntu-24.04
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: main
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - name: Update visual snapshots
              run: npm run test:visual:update
            - name: Verify visual snapshots
              run: npm run test:visual
            - name: Commit visual snapshots
              working-directory: .
              run: |
                  git add -- frontend/tests/visual/__screenshots__
                  if git diff --cached --quiet; then
                      echo "Visual snapshots are already up to date."
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -m "test: update Linux visual snapshots"
                  git push origin HEAD:main
