name: Application checks

on:
    push:
    pull_request:

jobs:
    backend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v6
              with:
                  python-version: "3.13"
                  enable-cache: true
            - run: uv sync --locked
            - run: uv run ruff format --check .
            - run: uv run ruff check .
            - run: uv run pytest
            - name: Check documentation and documented contracts
              working-directory: .
              run: uv run --project backend python scripts/check_docs.py

    frontend:
        runs-on: ubuntu-24.04
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - run: npm ci
            - run: npm ls --depth=0
            - run: npm run lint
            - run: npm test
            - run: npm run build
            - run: npx playwright install --with-deps chromium
            - run: npm run test:visual
